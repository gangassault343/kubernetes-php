apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: root
        - name: MYSQL_DATABASE
          value: cruddb
        ports:
        - containerPort: 3306

        volumeMounts:
        # ✅ ADD THIS (critical)
        - name: mysql-storage
          mountPath: /var/lib/mysql

        # existing
        - name: mysql-initdb
          mountPath: /docker-entrypoint-initdb.d

      volumes:
      # ✅ ADD THIS (critical)
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc

      # existing
      - name: mysql-initdb
        configMap:
          name: mysql-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306   # ✅  added (best practice)
  type: ClusterIP      # ✅  optional but recommended
