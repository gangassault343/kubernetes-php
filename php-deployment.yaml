apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php-crud
  template:
    metadata:
      labels:
        app: php-crud
    spec:
      containers:
      - name: php-crud
        image: gangassault343/myphpmysqlapp:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: php-service
spec:
  type: NodePort
  selector:
    app: php-crud
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30007